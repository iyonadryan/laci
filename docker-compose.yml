# Databases for the adapter tests: `docker compose up -d --wait`, then `pnpm test`.
# Non-default host ports avoid clashing with a locally installed PostgreSQL or MySQL (and with
# the Paraf repository's databases on 55432 and 53306).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: laci
      POSTGRES_DB: laci_test
    ports:
      - '55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d laci_test']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: laci
      MYSQL_DATABASE: laci_test
    ports:
      - '53307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -placi --silent']
      interval: 2s
      timeout: 5s
      retries: 60
    tmpfs:
      - /var/lib/mysql
